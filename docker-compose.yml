# LocalSell — production stack for localsell.in
#
#   Build + run:   docker compose --env-file deploy/localsell.env up -d --build
#   Logs:          docker compose --env-file deploy/localsell.env logs -f
#   Stop:          docker compose --env-file deploy/localsell.env down
#
# Host ports (bound to 127.0.0.1 only — Apache/Sentora reverse-proxies to them):
#   6000 -> web    (container :3000)   localsell.in
#   6001 -> admin  (container :3000)   admin.localsell.in
#   6002 -> api    (container :4000)   api.localsell.in
#   6004 -> store  (container :80)     store.localsell.in  (Expo web static export)
#        (6003 is taken by the money_visior container on this host)
#
# The api joins the EXTERNAL `mysql_config_dev_default` network so it can reach
# the shared MySQL container by name (same pattern as ams_container).

name: localsell

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./localsell-api
    image: localsell-api:latest
    container_name: localsell_api
    restart: unless-stopped
    env_file:
      - ./deploy/localsell.env
    ports:
      - "127.0.0.1:6002:4000"
    volumes:
      - localsell_uploads:/app/uploads
    networks:
      - localsell_internal
      - mysql_config_dev_default
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./localsell-web
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_WS_SERVER_URL: ${NEXT_PUBLIC_WS_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?set it in deploy/localsell.env}
    image: localsell-web:latest
    container_name: localsell_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:6000:3000"
    networks:
      - localsell_internal
    logging: *default-logging

  admin:
    build:
      context: ./localsell-admin
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_WS_SERVER_URL: ${NEXT_PUBLIC_WS_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?set it in deploy/localsell.env}
    image: localsell-admin:latest
    container_name: localsell_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:6001:3000"
    networks:
      - localsell_internal
    logging: *default-logging

  store:
    build:
      context: ./localsell-store
      args:
        EXPO_PUBLIC_GRAPHQL_URL: ${EXPO_PUBLIC_GRAPHQL_URL:?set it in deploy/localsell.env}
        EXPO_PUBLIC_WS_GRAPHQL_URL: ${EXPO_PUBLIC_WS_GRAPHQL_URL:?set it in deploy/localsell.env}
    image: localsell-store:latest
    container_name: localsell_store
    restart: unless-stopped
    ports:
      - "127.0.0.1:6004:80"
    networks:
      - localsell_internal
    logging: *default-logging

volumes:
  localsell_uploads:

networks:
  localsell_internal:
    name: localsell_internal
  mysql_config_dev_default:
    external: true
