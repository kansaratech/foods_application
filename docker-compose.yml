# LocalSell — this SAME zip/repo is unzipped into TWO separate directories on
# the server, one per environment (e.g. ~/localsell-prod/ and ~/localsell-uat/).
# Each directory gets its own deploy/localsell.env (same filename, different
# content: different DB, ports, hostnames, CONTAINER_PREFIX). Deploy from
# inside each directory:
#
#   Prod:  cd ~/localsell-prod && docker compose -p localsell-prod --env-file deploy/localsell.env up -d --build
#   UAT:   cd ~/localsell-uat  && docker compose -p localsell-uat  --env-file deploy/localsell.env up -d --build
#   Logs:  docker compose -p <project> --env-file deploy/localsell.env logs -f
#   Stop:  docker compose -p <project> --env-file deploy/localsell.env down
#
# Every container name, the internal network name, and every host port are
# parameterized (CONTAINER_PREFIX / *_PORT below) so the two projects never
# collide even though the compose file content is identical — the actual
# values come from each directory's own deploy/localsell.env.
#
# Host ports (bound to 127.0.0.1 only — Apache/Sentora reverse-proxies to them):
#   Prod (CONTAINER_PREFIX=localsell_prod):  web 6000, admin 6001, api 6002, store 6004, rider 6005
#   UAT  (CONTAINER_PREFIX=localsell_uat):   web 6100, admin 6101, api 6102, store 6104, rider 6105
#        (6003/6103 skipped — 6003 is taken by the money_visior container on this host)
#
# The api joins the EXTERNAL `mysql_config_dev_default` network so it can reach
# the shared MySQL container by name (same pattern as ams_container). Prod uses
# DB `localsell_prod`, UAT uses DB `localsell_uat` — same MySQL container, see
# LOCALSELL_DEPLOYMENT.md section 4.
#
# Uploads (`/app/uploads` in the api container) are bind-mounted to a plain
# directory on the HOST — not a Docker-managed named volume — so it's a normal
# folder any backup/rsync/replica tool can read directly, no
# `docker run --rm -v ... tar` step needed. Override the host path with
# UPLOADS_HOST_DIR in the env file; defaults to /var/localsell/uploads (prod)
# — UAT MUST override this to a different path (e.g. /var/localsell-uat/uploads)
# or the two environments will share/clobber the same upload files.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./localsell-api
    image: ${CONTAINER_PREFIX:-localsell}-api:latest
    container_name: ${CONTAINER_PREFIX:-localsell}_api
    restart: unless-stopped
    env_file:
      - ./deploy/localsell.env
    ports:
      - "127.0.0.1:${API_PORT:-6002}:4000"
    volumes:
      - ${UPLOADS_HOST_DIR:-/var/localsell/uploads}:/app/uploads
    networks:
      - internal
      - mysql_config_dev_default
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./localsell-web
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_WS_SERVER_URL: ${NEXT_PUBLIC_WS_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?set it in deploy/localsell.env}
    image: ${CONTAINER_PREFIX:-localsell}-web:latest
    container_name: ${CONTAINER_PREFIX:-localsell}_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-6000}:3000"
    networks:
      - internal
    logging: *default-logging

  admin:
    build:
      context: ./localsell-admin
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_WS_SERVER_URL: ${NEXT_PUBLIC_WS_SERVER_URL:?set it in deploy/localsell.env}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?set it in deploy/localsell.env}
    image: ${CONTAINER_PREFIX:-localsell}-admin:latest
    container_name: ${CONTAINER_PREFIX:-localsell}_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-6001}:3000"
    networks:
      - internal
    logging: *default-logging

  store:
    build:
      context: ./localsell-store
      args:
        EXPO_PUBLIC_GRAPHQL_URL: ${EXPO_PUBLIC_GRAPHQL_URL:?set it in deploy/localsell.env}
        EXPO_PUBLIC_WS_GRAPHQL_URL: ${EXPO_PUBLIC_WS_GRAPHQL_URL:?set it in deploy/localsell.env}
    image: ${CONTAINER_PREFIX:-localsell}-store:latest
    container_name: ${CONTAINER_PREFIX:-localsell}_store
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STORE_PORT:-6004}:80"
    networks:
      - internal
    logging: *default-logging

  # Rider (delivery) app — Expo web static export, served by nginx.
  rider:
    build:
      context: ./localsell-rider
      args:
        EXPO_PUBLIC_GRAPHQL_URL: ${EXPO_PUBLIC_GRAPHQL_URL:?set it in deploy/localsell.env}
        EXPO_PUBLIC_WS_GRAPHQL_URL: ${EXPO_PUBLIC_WS_GRAPHQL_URL:?set it in deploy/localsell.env}
        EXPO_PUBLIC_GOOGLE_MAPS_API_KEY_ANDROID: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: ${CONTAINER_PREFIX:-localsell}-rider:latest
    container_name: ${CONTAINER_PREFIX:-localsell}_rider
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RIDER_PORT:-6005}:80"
    networks:
      - internal
    logging: *default-logging

networks:
  internal:
    name: ${CONTAINER_PREFIX:-localsell}_internal
  mysql_config_dev_default:
    external: true
