<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — LocalSell Store</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #16293f; color: #e8f0ff; padding: 24px; text-align: center;
      }
      .card { max-width: 360px; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
        background: #1c5bc7; display: grid; place-items: center;
      }
      .mark img { width: 44px; height: 44px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 22px; color: #a9c2e6; line-height: 1.5; font-size: 14px; }
      a.retry {
        display: inline-block; text-decoration: none;
        border-radius: 12px; background: #1c5bc7; color: #fff;
        font-weight: 600; padding: 12px 24px;
      }
      a.retry:hover { background: #1a52b4; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><img src="/192.png" alt="LocalSell" /></div>
      <h1>You're offline</h1>
      <p>We couldn't reach LocalSell. Check your connection and try again.</p>
      <a class="retry" href="/">Retry</a>
    </div>
  </body>
</html>
